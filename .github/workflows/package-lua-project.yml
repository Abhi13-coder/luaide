name: Package Lua Project

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Path (in this repo) to the Lua project to package, e.g. projects/weather_app"
        required: true
      app_name:
        description: "Display name for the packaged app"
        required: true
        default: "Lua App"
      application_id:
        description: "Android application ID, e.g. com.example.weatherapp"
        required: true
        default: "com.luaide.runner.sample"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (side by side)
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Inject the Lua project into the runner template
        run: |
          set -e
          SRC="${{ inputs.project_path }}"
          if [ ! -d "$SRC" ]; then
            echo "::error::project_path '$SRC' does not exist in this repo. Commit your Lua project first, then re-run with its real path."
            exit 1
          fi
          ASSETS="lua-ide-android/packaging/runner-template/app/src/main/assets/lua_project"
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          rsync -a --exclude ".lua/" "$SRC/" "$ASSETS/"
          find "$ASSETS" -maxdepth 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build packaged APK
        working-directory: lua-ide-android/packaging/runner-template
        run: >
          gradle assembleDebug --no-daemon
          -PappId="${{ inputs.application_id }}"
          -PappLabel="${{ inputs.app_name }}"

      - name: Upload packaged APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-armeabi-v7a
          path: lua-ide-android/packaging/runner-template/app/build/outputs/apk/debug/*.apk
