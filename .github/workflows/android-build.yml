name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build runner-template debug APK
        working-directory: lua-ide-android/packaging/runner-template
        run: gradle assembleDebug --no-daemon

      - name: Upload template APK for stage 2
        uses: actions/upload-artifact@v4
        with:
          name: runner-template-apk
          path: lua-ide-android/packaging/runner-template/app/build/outputs/apk/debug/*.apk

  build-ide:
    needs: build-template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-29"

      - name: Download stage 1's template APK
        uses: actions/download-artifact@v4
        with:
          name: runner-template-apk
          path: template-download

      - name: Download the on-device aapt2 binary (from build-aapt2.yml's release)
        run: |
          mkdir -p lua-ide-android/app/src/main/assets/tools
          curl -fL -o lua-ide-android/app/src/main/assets/tools/aapt2 \
            "https://github.com/${{ github.repository }}/releases/download/aapt2-armeabi-v7a/aapt2-armeabi-v7a" \
            || echo "aapt2 release not built yet — run build-aapt2.yml once; Preview will still work without custom app name/ID until then"

      - name: Embed android.jar (straight from the SDK already installed above)
        run: |
          mkdir -p lua-ide-android/app/src/main/assets/tools
          cp "$ANDROID_SDK_ROOT/platforms/android-29/android.jar" lua-ide-android/app/src/main/assets/tools/android.jar

      - name: Embed the template APK as app/src/main/assets/template.apk
        run: |
          mkdir -p lua-ide-android/app/src/main/assets
          apk_file=$(find template-download -name "*.apk" | head -1)
          cp "$apk_file" lua-ide-android/app/src/main/assets/template.apk
          ls -la lua-ide-android/app/src/main/assets/ lua-ide-android/app/src/main/assets/tools/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build IDE debug APK (armeabi-v7a)
        working-directory: lua-ide-android
        run: gradle assembleDebug --no-daemon

      - name: Upload IDE APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lua-ide-debug-armeabi-v7a
          path: lua-ide-android/app/build/outputs/apk/debug/*.apk
